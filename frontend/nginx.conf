server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Static assets — return 404 if not found (never fall through to index.html)
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health check — exact match, proxied directly
    location = /health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SSE stream — disable buffering so events flow immediately
    location /analyze {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Admin API — subpaths only (/admin/tokens, /admin/metrics, etc.)
    # /admin alone is the SPA Admin page, served by React Router
    location ~ ^/admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Bare API list endpoints — these live at the prefix itself (GET /jobs,
    # GET /roadmap) and are NOT React routes, so they must be proxied. Exact
    # matches (`location =`) take priority over the segment regex below, which
    # otherwise falls /jobs through to the SPA and returns index.html.
    location = /jobs {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /roadmap {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # API routes — require at least one path segment after the prefix so that
    # bare frontend routes like /auth, /profile are NOT proxied.
    # e.g. /auth/login → backend; /auth → index.html (React handles routing)
    location ~ ^/(auth|cv|interview|jobs|recruiter|referrals|roadmap|profile|interview-bank)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA fallback — all non-asset, non-API paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
